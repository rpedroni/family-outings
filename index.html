<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243e33">
  <title>Passeios em Família — Guia de passeios</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="card-layout.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <a class="skip-link" href="#results">Pular para os passeios</a>
  <main style="padding-top:16px">
    <h1 class="compact-title">Passeios em Família</h1>
    <section class="browse" aria-labelledby="browse-heading">
      <div class="filter-title"><h2 id="browse-heading" class="sr-only">Filtros</h2><button class="text-button" id="reset" type="button">Limpar filtros</button></div>
      <form id="filters" role="search" aria-label="Encontrar passeios">
        <div class="primary-controls"><div class="search-field"><label for="search">Buscar no guia</label><input type="search" id="search" name="search" placeholder="Um lugar, uma cidade ou uma ideia…" autocomplete="off"></div><label class="saved-toggle" for="saved-only"><input type="checkbox" id="saved-only" name="saved-only"><span>Minha lista <span id="saved-count">(0)</span></span></label></div>
        <div class="filter-grid">
          <div><label for="category">Qual é a boa?</label><select name="category" id="category"><option value="all">Todos os passeios</option><option value="park">Parques</option><option value="museum">Museus</option><option value="farm">Fazendas</option><option value="zoo">Zoológicos</option><option value="show">Espetáculos</option></select></div>
          <div><label for="area">Até onde vamos?</label><select name="area" id="area"><option value="all">Curitiba e região</option><option value="curitiba">Em Curitiba</option><option value="nearby">Cidades próximas</option></select></div>
          <div><label for="setting">Coberto ou ao ar livre?</label><select name="setting" id="setting"><option value="all">Qualquer ambiente</option><option value="outdoor">Ao ar livre</option><option value="indoor">Em local fechado</option><option value="mixed">Áreas internas e externas</option></select></div>
          <div><label for="cost">Entrada</label><select name="cost" id="cost"><option value="all">Qualquer valor</option><option value="free">Entrada gratuita</option><option value="paid">Entrada paga</option><option value="unknown">Consultar valores</option></select></div>
        </div>
      </form>
      <p class="storage-note" id="storage-note">Sua lista e os lugares que vocês já visitaram ficam salvos apenas neste dispositivo. Sem conta e sem sincronização na nuvem.</p>
    </section>
    <section id="results" class="results" aria-labelledby="results-heading" tabindex="-1" aria-busy="true">
      <div class="results-bar"><h2 id="results-heading" class="sr-only">Passeios</h2><p id="result-count" role="status" aria-live="polite">Carregando o guia…</p></div>
      <div id="activity-grid" class="activity-grid"></div>
      <section id="visited-section" class="visited-section" aria-labelledby="visited-heading" hidden>
        <h2 id="visited-heading">Já fomos</h2>
        <ul id="visited-list"></ul>
      </section>
      <div id="state" class="state"><p class="eyebrow">QUASE TUDO PRONTO</p><h3>Abrindo o guia de passeios…</h3></div>
    </section>
  </main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <noscript><p class="noscript">É necessário ativar o JavaScript para carregar e filtrar este guia. Você também pode ler diretamente o arquivo local activities.json.</p></noscript>
</body>
</html>
